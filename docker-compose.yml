services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - nexo_pg:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nexo:nexo@db:5432/nexo
      JWT_SECRET: change-this-before-production
      CORS_ORIGINS: http://localhost:8080
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@nexoia.mx
      ADMIN_PASSWORD: "12345678"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  nexo_pg:
